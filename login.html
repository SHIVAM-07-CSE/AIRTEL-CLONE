<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtel Login</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand" href="#">
                <img src="airtel.png" alt="Airtel Logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Wi-Fi
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Wi-Fi Bill Payment</a></li>
                            <li><a class="dropdown-item" href="#">Wi-Fi Plans</a></li>
                            <li><a class="dropdown-item" href="#">New Connection</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Postpaid</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Prepaid</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">DTH</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Airtel Black</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Help</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Login Section -->

    <section class="login-page">

        <div class="container-fluid">

            <div class="row">

                <!-- Left -->

                <div class="col-lg-5 login-left d-flex align-items-center">

                    <div class="login-content">

                        <h1>
                            We're holding the door for you!
                        </h1>

                        <p>
                            Login now and manage all your Airtel services and payments with ease.
                        </p>

                    </div>

                </div>

                <!-- Right -->

                <div class="col-lg-7 login-right d-flex justify-content-center align-items-center">

                    <div class="card login-card">

                        <h3>Login</h3>

                        <form>

                            <div class="mb-4">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input type="tel" class="form-control" placeholder="Enter your mobile number">

                            </div>

                            <button class="btn btn-dark w-100">
                                SEND OTP
                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <small class="text-muted">

                                By continuing, you agree to Airtel's

                                <a href="#">Terms & Conditions</a>

                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
